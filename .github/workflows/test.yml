name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (cargo test --workspace)
    runs-on: ubuntu-latest
    steps:
      # vendor/perch is the Perch stack this repo consumes (a submodule).
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Pinned to match the workspace-root rust-toolchain.toml (keep the two in
      # lockstep) so contract wasm bytecode is reproducible rather than built
      # against whatever `stable` happens to be on the runner that day.
      # `wasm32v1-none` is the target the contract wasms compile for.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: contracts

      # Fast, prebuilt-binary install (no compile-from-source).
      - name: Install just
        uses: taiki-e/install-action@just

      # `stellar-cli` (binary `stellar`), `stellar-scaffold-cli` (binary
      # `stellar-scaffold`), and the registry plugin (binary
      # `stellar-registry`, which `just perch-infra` uses to resolve Perch's
      # infra by name) aren't available as prebuilt actions, so build them
      # from crates.io. Cached separately from the cargo registry/target cache
      # above (keyed only on tool names, not Cargo.lock) so a workspace
      # dependency bump doesn't force re-installing these.
      - name: Cache Stellar CLI tools
        id: stellar-tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/stellar
            ~/.cargo/bin/stellar-scaffold
            ~/.cargo/bin/stellar-registry
          key: ${{ runner.os }}-stellar-cli-tools-v2

      - name: Install Stellar CLI tools
        if: steps.stellar-tools-cache.outputs.cache-hit != 'true'
        run: |
          # stellar-cli v27's hardware-wallet support pulls `libdbus-sys`
          # (dbus-secret-service) and `hidapi` (Ledger), whose build.rs's panic
          # unless the system dbus + udev dev headers + pkg-config are present.
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
          # Idempotent: the cargo cache can restore some of these binaries
          # even when this cache misses, and `cargo install` refuses to
          # overwrite an existing one.
          command -v stellar >/dev/null || cargo install --locked stellar-cli
          command -v stellar-scaffold >/dev/null || cargo install --locked stellar-scaffold-cli
          command -v stellar-registry >/dev/null || cargo install --locked stellar-registry-cli@0.1.0

      # Perch's account reads its pinned infra (stateless registry id and the
      # compiler/interpreter/spending-limit wasm) from a git-ignored cache in
      # the submodule at build time; this resolves it from testnet by name,
      # exactly as Perch's own CI does.
      - name: Fetch Perch's pinned infra
        run: just perch-infra

      # Perch's deployables (from vendor/perch), then Nido's own contracts;
      # the factory embeds the Perch account wasm.
      - name: Build contract wasms
        run: just build-contracts

      # The whole Rust workspace: the factory, the policy contracts, and the
      # integration suites that drive the Perch account, controller, pool, and
      # adapter wasm under enforcing authorization, replaying the committed
      # real UltraHonk proofs (crates/integration-tests/fixtures/zk/), and the
      # `costs` suite's 75%-of-network-limit budget gate.
      - name: cargo test --workspace
        run: cargo test --workspace

      # Re-prove every committed fixture from source with Perch's pinned,
      # checksum-verified nargo/bb (vendor/perch/scripts/zk-toolchain.sh) and
      # fail on any byte of drift: proofs are deterministic, so a diff means
      # the statement, the circuit, or the toolchain changed without the
      # fixtures being regenerated.
      - name: Reproduce the real-proof fixtures
        run: |
          just gen-zk-fixtures
          git diff --exit-code crates/integration-tests/fixtures/zk

  unit:
    name: Unit (TestAuthenticator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Unit tests (shim crypto vs SDK parsers)
        run: npx vitest run --config vitest.support.config.ts

  e2e:
    name: E2E (fast UI + CDP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps chromium firefox webkit
      # Mirrors the deploy/preview workflows: build the SDK, then the frontend,
      # so the static webServer serves a real dist for the e2e tiers.
      - name: Build passkey-sdk
        run: npx tsc -p ./packages/passkey-sdk/tsconfig.json
      - name: Build frontend
        run: npx astro build --root ./packages/frontend
      - name: Fast UI e2e tier (shim — chromium/firefox/webkit)
        run: npx playwright test --grep @fast
      - name: Chromium CDP virtual-authenticator fidelity lane
        run: npx playwright test --project=chromium-cdp
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # ADVISORY, non-blocking for now (every step is continue-on-error) so a
    # freshly-published advisory in a transitive dep can't red-wall unrelated
    # PRs. Triage the findings, then flip these to gating before mainnet (see
    # docs/SUPPLY_CHAIN.md). Dependabot (.github/dependabot.yml) opens the
    # actual update PRs; this job is the at-a-glance "any known CVEs right now"
    # signal in the Checks tab.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cargo-audit reads Cargo.lock against the RustSec advisory DB -- no
      # workspace build needed, so this is fast.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (advisory)
        continue-on-error: true
        run: cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm audit works straight off each committed package-lock.json (no
      # install needed). Loop the authored roots; keep going on findings.
      - name: npm audit (advisory)
        continue-on-error: true
        run: |
          for d in . packages/passkey-sdk packages/frontend packages/stellar-wallets-kit-module \
                   infra/nido-resolver infra/pool-indexer infra/recovery-relay; do
            echo "== npm audit: $d =="
            (cd "$d" && npm audit --audit-level=high) || true
          done
