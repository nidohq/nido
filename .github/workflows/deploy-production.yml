name: Deploy Production

# nido.fyi. Manual only (workflow_dispatch) — unlike deploy-testnet.yml, this
# is never a side effect of merging to main, since it's the domain real
# visitors land on.
# Today nido.fyi still serves a testnet-configured build
# (account creation is "coming soon" there regardless, via
# allowAccountCreation.ts) — that's deliberate until a mainnet Perch
# deployment and mainnet relayer exist. When they do, this workflow's env
# vars below are the only things that need to change for the real cutover.

# WARNING — PUBLIC_STELLAR_NETWORK/PUBLIC_RELAYER_URL/PUBLIC_RELAYER_SIM_SOURCE
# below are now real mainnet values, but vars.PUBLIC_PERCH_DEPLOYMENT_MAINNET is
# still unset. There's no mainnet default to fall back to (unlike testnet's
# perch.TESTNET), so the build still fails loud rather than silently shipping a
# testnet-configured build believing it's mainnet. That means running this
# workflow as-is still BREAKS nido.fyi's current, working testnet-configured
# production build.
#
# PUBLIC_PERCH_DEPLOYMENT_MAINNET/PUBLIC_INVITE_SERVICE_URL_MAINNET/
# PUBLIC_INVITE_SERVICE_API_KEY_MAINNET are deliberately *_MAINNET-suffixed,
# not the plain names deploy-testnet.yml reads: repo variables/secrets are
# global, not per-workflow, and deploy-testnet.yml auto-runs on every push to
# main, so a shared name would leak whichever value was set last into the
# other workflow's build.
#
# Do not merge this version of the file to main until Perch+Factory lands and
# vars.PUBLIC_PERCH_DEPLOYMENT_MAINNET is set.

on:
  workflow_dispatch: {}

env:
  PAGES_PROJECT: nido
  PUBLIC_EXAMPLE_DAPP_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
  PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/perch: the npm workspace includes its packages.
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        run: npm run build:packages

      - name: Build frontend (production)
        env:
          # See the file-level WARNING above before touching any of these.
          PUBLIC_STELLAR_NETWORK: mainnet
          PUBLIC_RELAYER_URL: https://nido-mainnet.fly.dev
          PUBLIC_RELAYER_SIM_SOURCE: GB62GN4DMXIPFGZMGITUP2XIGIVDV3IBK263LMEVQ7AEBHF6KWXLIM6V
          # The full PerchDeployment JSON (perch.fromPerchManifest(manifest,
          # factory) — see lib/recovery/deployment.ts), built from Perch's
          # vendor/perch/deployments/mainnet.json plus Nido's
          # factory.mainnet.json. A *_MAINNET-suffixed repo variable, not the
          # plain PUBLIC_PERCH_DEPLOYMENT deploy-testnet.yml reads — repo
          # variables are global, not per-workflow, and deploy-testnet.yml
          # auto-runs on every push to main, so a shared name would leak
          # whichever value was set last into the other workflow's build.
          # There's no mainnet default to fall back to if it's left unset
          # (unlike testnet's perch.TESTNET).
          PUBLIC_PERCH_DEPLOYMENT: ${{ vars.PUBLIC_PERCH_DEPLOYMENT_MAINNET }}
          # infra/invite's base URL + shared x-api-key (lib/demo/config.ts),
          # for nido-invite-mainnet.fly.dev — again *_MAINNET-suffixed, not
          # deploy-testnet.yml's plain names, for the same global-variable
          # reason as above. Empty disables the /demo/start invite check, it
          # doesn't break the build.
          PUBLIC_INVITE_SERVICE_URL: ${{ vars.PUBLIC_INVITE_SERVICE_URL_MAINNET }}
          PUBLIC_INVITE_SERVICE_API_KEY: ${{ secrets.PUBLIC_INVITE_SERVICE_API_KEY_MAINNET }}
        run: npx astro build --root ./packages/frontend

      # `--branch main` is Cloudflare Pages' production deployment for this
      # project (the `nido-1am.pages.dev` origin worker-proxy-nido's default
      # `PAGES` var points at).
      - name: Deploy to Cloudflare Pages (production)
        run: |
          npx wrangler pages deploy packages/frontend/dist/ \
            --project-name "$PAGES_PROJECT" \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Edge proxy for *.nido.fyi -> the nido Pages origin (PR-preview subdomain
      # rewrites + reserved dApp subdomains). Lives here, not its own repo, because
      # its origin and RESERVED_DAPP_SUBDOMAINS version with the frontend it fronts.
      # Requires the CF API token to include Workers Scripts:Edit (not just Pages).
      - name: Deploy nido.fyi proxy worker
        run: npx wrangler deploy --config frontend/worker-proxy-nido/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Name resolver: serves <subdomain>.nido.fyi/.well-known/nido.json. Its
      # route is more specific than the proxy's "*.nido.fyi/*", so Cloudflare
      # dispatches the well-known path here and everything else stays on the
      # proxy. Same token scopes as the proxy (Workers Scripts:Edit + Routes:Edit).
      - name: Deploy nido-resolver worker
        run: npx wrangler deploy --config infra/nido-resolver/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
