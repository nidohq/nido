name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview.yml'
      # The example-dApp preview (example-preview.yml) points its wallet at
      # THIS PR's N.test.nido.fyi — so a dApp-only PR still needs the wallet
      # preview deployed alongside.
      - 'examples/status-message-dapp/**'
      - 'examples/local-fee-payer/**'

permissions:
  contents: read
  pull-requests: write

env:
  PAGES_PROJECT: nido
  # "Example app" link points at THIS PR's example-dApp preview (deployed by
  # example-preview.yml to the mysoroban project's example-pr-<N> branch alias),
  # not the production GitHub Pages demo — so the wallet preview and the example
  # preview exercise each other. deploy-production.yml keeps the production URL.
  PUBLIC_EXAMPLE_DAPP_URL: "https://example-pr-${{ github.event.pull_request.number }}.mysoroban.pages.dev/"
  PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        run: npm run build:packages

      - name: Build frontend
        env:
          # No relayer: this preview runs a deployment the shared relayer
          # does not serve. A friendbot-funded G key in the browser is the
          # source and fee payer of every transaction, and friendbot funds
          # new accounts (lib/localSubmitterGate.ts; testnet builds only).
          PUBLIC_NIDO_LOCAL_SUBMITTER: "1"
          # Overrides the Perch deployment (JSON, or `none`). This branch
          # points its preview at perch dev's separate testnet deployment (the
          # bitswell fork's Perch at fc0fb2b, in its own registries;
          # perch-overlay/) and the Nido factory built from this branch for
          # its account, 7a03f4c2. Its WebAuthn verifier is the
          # perch/verifiers instance, which admin documents name as
          # webauthnVerifierName. It equals the SDK's perch.TESTNET.
          PUBLIC_PERCH_DEPLOYMENT: '{"network":"Test SDF Network ; September 2015","factory":"CAFTWZR6EF32LSXBHCZCKXUVHHOKH7ISPZ4F4PGEC4L3Q2FKHAJS6BC4","webauthnVerifier":"CDPT2W5ZYRHKD7ESV4OXPKYBWCCCAZRKRDAI4EAE7ACXE5ZN76F23OZP","webauthnVerifierName":"perch-webauthn-verifier@0.1.2","statelessRegistry":"CDFVJKO6FOFL2W4AWBBHYXMK3CMTTPMZZJTLLN2GCB5SRF5URW5MNIQF","docCompiler":"CDZAF3GIX6Z573FDG64PFFMQMTER57UE5HSFGQRZ3EMTD5KD7IAEGNUY","interpreter":"CA4THHSYJQGZKSZWTH53WCI6JRDEH42I4YYGH6MDF2PQDF2OAW3I3R3T","spendingLimit":"CB5N4HGJOLEDRMXX7EXXT7HDMC46JZAU7AYOOYDJPFGGEQHYNB5QZSFA","recoveryController":"CDHF6CPOICTDIPFEFOCKWVJXUBHH3HZ5NN52DQDEJKYGKKJR6DR6DPCU","zkPool":"CAUKQRNVQETVQGB52SZ3FJMOHH5VIBVURJIM4TO577YCUM5OIFXC6XTM","zkAdapter":"CBSUWADJJVNXTJ6JD2OITAX4BLQ5XCXL4OFZF354U4MASFCTJXYFSQF5","circuitId":"9e39c41f4f35aad43e64b255dfe3ba13f10e8c9d36d6f56fce23c2d97c0a0b4a","treeDepth":32,"accountWasmHash":"7a03f4c29b8a7fe099929d31c1fe87ca4f19d8b791baeb3ae17b7316b9a48220"}'
          # infra/invite's base URL + shared x-api-key (lib/demo/config.ts).
          # Empty disables the /demo/start invite check, it doesn't break the
          # build — but without these, every PR preview hard-fails that check
          # with "PUBLIC_INVITE_SERVICE_URL is not set." before create_account
          # ever runs, same as deploy-testnet.yml needed these for test.nido.fyi.
          PUBLIC_INVITE_SERVICE_URL: ${{ vars.PUBLIC_INVITE_SERVICE_URL }}
          PUBLIC_INVITE_SERVICE_API_KEY: ${{ secrets.PUBLIC_INVITE_SERVICE_API_KEY }}
        run: npx astro build --root ./packages/frontend

      # Static fee lab: the custom preview domain is the dapp; the Pages branch
      # alias is its separate wallet origin. No hosted signing key or bootstrap API.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/local-fee-payer/runtime/target
          key: fee-runtime-rust1971-${{ runner.os }}-${{ hashFiles('examples/local-fee-payer/runtime/Cargo.lock') }}

      - name: Build static testnet fee demo
        working-directory: examples/local-fee-payer
        env:
          FEE_PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npm ci
          npm run build:preview

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy packages/frontend/dist/ \
            --project-name "$PAGES_PROJECT" \
            --branch "pr-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const previewUrl = `https://${prNum}.test.nido.fyi`;
            const body = `**Preview deployed!**\n\n${previewUrl}\n\nAccount URLs use numeric preview suffixes, for example \`<contract-address>--${prNum}.test.nido.fyi\`.`;

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed!')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }
