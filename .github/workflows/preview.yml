name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview.yml'
      # The example-dApp preview (example-preview.yml) points its wallet at
      # THIS PR's N.test.nido.fyi — so a dApp-only PR still needs the wallet
      # preview deployed alongside.
      - 'examples/status-message-dapp/**'

permissions:
  contents: read
  pull-requests: write

env:
  PAGES_PROJECT: nido
  # "Example app" link points at THIS PR's example-dApp preview (deployed by
  # example-preview.yml to the mysoroban project's example-pr-<N> branch alias),
  # not the production GitHub Pages demo — so the wallet preview and the example
  # preview exercise each other. deploy-production.yml keeps the production URL.
  PUBLIC_EXAMPLE_DAPP_URL: "https://example-pr-${{ github.event.pull_request.number }}.mysoroban.pages.dev/"
  PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/perch: the npm workspace includes its packages.
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build workspace packages
        run: npm run build:packages

      - name: Build frontend
        env:
          # No relayer: this preview runs a deployment the shared relayer
          # does not serve. A friendbot-funded G key in the browser is the
          # source and fee payer of every transaction, and friendbot funds
          # new accounts (lib/localSubmitterGate.ts; testnet builds only).
          PUBLIC_NIDO_LOCAL_SUBMITTER: "1"
          # Overrides the Perch deployment (JSON, or `none`). This branch
          # points its preview at the separate M6 testnet deployment (the
          # bitswell fork's Perch at 437a07d, in its own registry) and the
          # Nido factory built from this branch for its account, 38f06b1d.
          PUBLIC_PERCH_DEPLOYMENT: '{"network":"Test SDF Network ; September 2015","factory":"CANGJ2QV5YGKNCXFI2ZCNJ3FCE2Y255X4UZWQCMHTDVA3RRUJ2NXVCR5","webauthnVerifier":"CDV5HBEG3UL2YUNYG4RD4J5CARTDVUPHJ7TAADQKIIIRNVHP4EEOAUIF","statelessRegistry":"CD5UG7SBYQNUWHSY7HTS4CK7LFORQZUDHAQO72BSAF76P7ZPRGNZQDDI","docCompiler":"CBIOROJJSXJKCUOCQSZW75JCVDTTGATQJ5OTMMZJQ2GHGSSQZYSIWYGK","interpreter":"CBEO3WGW4CA4VK5WSSZYUCX2OH7LP6FA4HPHDWX6UHVFCBZK5GMYDZJY","spendingLimit":"CDRVCE7AMNWXSFMW53T7RNFF6JBPODHPJBY4OD5I63WLZPTHOH27X2CW","recoveryController":"CB6DTVZ6QB4O7Z6RAZUXNLCB5IQRBZZ2AXSMJR7DWUL5M67NTXZBXJSY","zkPool":"CBY7DPBKHMV57HQWXVYNZCEY7KZ3MJHINPAXJE6FYYTELNXE2YZPNAPO","zkAdapter":"CBCEAKQIXWHA4VETKQYRH3C7UDMVSXSWTHVLQ2ZDEAOPDJ4C6IT52TH6","circuitId":"9e39c41f4f35aad43e64b255dfe3ba13f10e8c9d36d6f56fce23c2d97c0a0b4a","treeDepth":32,"accountWasmHash":"38f06b1df6f6033968236cea14b2e5da87266fd5b90e20bdbef509c0f999c387"}'
          # infra/invite's base URL + shared x-api-key (lib/demo/config.ts).
          # Empty disables the /demo/start invite check, it doesn't break the
          # build — but without these, every PR preview hard-fails that check
          # with "PUBLIC_INVITE_SERVICE_URL is not set." before create_account
          # ever runs, same as deploy-testnet.yml needed these for test.nido.fyi.
          PUBLIC_INVITE_SERVICE_URL: ${{ vars.PUBLIC_INVITE_SERVICE_URL }}
          PUBLIC_INVITE_SERVICE_API_KEY: ${{ secrets.PUBLIC_INVITE_SERVICE_API_KEY }}
        run: npx astro build --root ./packages/frontend

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy packages/frontend/dist/ \
            --project-name "$PAGES_PROJECT" \
            --branch "pr-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const previewUrl = `https://${prNum}.test.nido.fyi`;
            const body = `**Preview deployed!**\n\n${previewUrl}\n\nAccount URLs use numeric preview suffixes, for example \`<contract-address>--${prNum}.test.nido.fyi\`.`;

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed!')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }
