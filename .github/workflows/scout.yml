name: Scout audit

# Static security analysis of every Soroban contract crate with CoinFabrik
# Scout (https://github.com/CoinFabrik/scout-actions). Scout runs a set of
# Soroban-specific dylint detectors (unprotected update-current-contract-wasm,
# unchecked arithmetic, DoS patterns, etc.) over each crate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: the jobs only check out code and upload
# artifacts, neither of which needs write access to anything.
permissions:
  contents: read

jobs:
  scout:
    name: Scout (${{ matrix.contract }})
    runs-on: ubuntu-latest
    strategy:
      # One contract's findings shouldn't hide another's -- run all to
      # completion so the Checks tab shows the full per-contract picture.
      fail-fast: false
      matrix:
        # Nido's own contract crates under contracts/. The account, recovery
        # controller, ZK pool, and ZK adapter are Perch's (vendor/perch) and
        # are audited in Perch's pipeline.
        contract:
          - factory
          - multisig-policy
          - name-registry
          - spending-limit-policy
          - status-message
    steps:
      # Submodules: the workspace's path dependencies on vendor/perch must
      # exist for cargo to resolve any member.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      # The action builds a Docker image with the Scout toolchain, mounts the
      # whole workspace into it, and runs `cargo scout-audit` from
      # `working_directory`. Mounting the full checkout (not just the crate
      # dir) matters: these crates are workspace members, so resolving their
      # dependencies needs the root Cargo.toml/Cargo.lock.
      # Note the action's real input is `working_directory` -- the marketplace
      # README's `target:` example is stale and silently ignored.
      #
      # fail_on_error: false -- the action's own pass/fail (a FAIL marker on
      # ANY finding, any severity) is disabled; "Fail on Critical findings"
      # below replaces it with a severity-aware gate. Scout's Docker base
      # image is also unpinned (FROM coinfabrik/scout:latest), so its
      # detector set (and internal nightly toolchain) can change between
      # runs independent of code changes -- severity-gating is the
      # practical floor, not just a convenience.
      #
      # continue-on-error: true -- separately, `factory`'s build.rs panics
      # inside Scout's sandbox because it expects the Perch account wasm
      # already staged at a dylint-internal target path, which nothing here
      # ever populates (Scout analyzes `contracts/factory` in isolation, it
      # never runs `just build-contracts` first). That's a hard cargo build
      # failure, not a findings-based one, so fail_on_error/the severity
      # gate below can't rescue it -- this step itself has to tolerate it.
      - name: Run Scout
        id: scout
        continue-on-error: true
        uses: coinfabrik/scout-actions@6f5e53f890c1fe20c9b08369aec4f183a5b710b2 # v3.2
        with:
          working_directory: contracts/${{ matrix.contract }}
          fail_on_error: 'false'

      # The action writes its markdown report under scout-report/ regardless
      # of fail_on_error. `always()` so the report is available even if a
      # later step in this job fails -- that's when someone needs to read it.
      - name: Upload Scout report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scout-report-${{ matrix.contract }}
          path: scout-report/
          retention-days: 7

      # Severity-aware gate: each finding's own section in report.md has a
      # "**Impact:** <Severity>" line (verified against a real report, not
      # the summary table/header, which also contain the word "Critical" but
      # aren't per-finding markers) -- fail only if at least one finding is
      # Critical. Medium/Minor/Enhancement findings stay visible in the
      # uploaded report but don't block merge.
      - name: Fail on Critical findings
        if: always()
        run: |
          if grep -q '\*\*Impact:\*\* Critical' scout-report/report.md 2>/dev/null; then
            echo "Critical Scout finding(s) present -- see the uploaded report."
            exit 1
          fi
          echo "No Critical findings (Medium/Minor/Enhancement are advisory only)."
