name: PR description

# The squash commit takes this PR's title as its subject and its body as its
# message (CONTRIBUTING.md "Pull requests and commits"), so both are checked
# against the templates in .github/. `edited` re-runs the check when the
# title or body is fixed; the job is seconds long and builds nothing, which is
# why it lives apart from the test workflows.
#
# Findings warn, they do not fail: .github/pr-checks.json "blocking" switches
# both jobs to failing (ready PRs only, for the description).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: Title and description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test the rules
        run: node --test scripts/pr-lint/*.test.mjs

      # Through the environment, never interpolated into the script: the
      # title and body are untrusted text.
      - name: Check the title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-lint/check-pr.mjs

  commits:
    name: Commit messages
    # A body or title edit does not change the commits.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          from="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          npx --yes @commitlint/cli@21.2.3 --from "$from" --to "$HEAD_SHA" --verbose
