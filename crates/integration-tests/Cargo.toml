[package]
name = "nido-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
# Soroban
# "hazmat-address" is needed by the M1 zk_fixture address-pinning test
# (crates/integration-tests/tests/it/zk_fixture.rs): it exposes
# `Address::to_payload`/`AddressPayload::to_address`, the only public way to
# build/inspect an `Address`'s raw 32-byte contract-id, which is how the test
# proves `env.register_at` actually pins a contract at the exact id the ZK
# recovery proof's `auth_hash` binds.
soroban-sdk = { workspace = true, features = ["testutils", "hazmat-address"] }
stellar-accounts = { workspace = true }

# Crypto
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

# Encoding
base64 = { workspace = true }

[dev-dependencies]
# ZK: cross-language Poseidon2 hash parity (host vs Noir)
# tag v27.0.0 — Poseidon2 parity is byte-critical vs the circuit; v27.0.0 is a
# version-only bump over the prior v26.0.0 pin (Cargo.toml only, no algorithm change).
soroban-poseidon = { git = "https://github.com/stellar/rs-soroban-poseidon", tag = "v27.0.0" }
serde_json = "1"
# M1 Task 5's zk_recovery_lifecycle test exercises the real
# `ZkRecovery::initiate_recovery` contract entry point end-to-end.
nido-zk-recovery = { path = "../../contracts/zk-recovery" }
# M2 Task 4's zk_recovery_guard end-to-end test decodes
# `contract::NidoSmartAccountError` error codes from the account's guard --
# a plain `rlib` dependency (this crate is not a `#[contract]`/cdylib, so no
# wasm-export collision; the account under test is still deployed from
# `SMART_ACCOUNT_WASM` bytes, not this Rust type).
nido-smart-account = { path = "../../contracts/smart-account" }
# The preauth-sweep-policy scoping tests import `PreauthSweepParams` (to build
# the install map) and `SweepError` (to assert exact rejection codes). Imported
# as an `rlib` dev-dep — same pattern as the two crates above; this crate is not
# a `#[contract]`/cdylib so there is no wasm-export collision, and the policy
# under test is still deployed from `PREAUTH_SWEEP_POLICY_WASM` bytes.
nido-preauth-sweep-policy = { path = "../../contracts/preauth-sweep-policy" }
# SPIKE (apply_doc e2e): the REAL perch doc-compiler and interpreter contract
# types, registered at the exact content addresses the account derives
# (`nido_smart_account::doc::{compiler,interpreter}_address`) — mirroring
# perch's own `perch-testkit` native mode. The "contract" feature turns on the
# compiler's parser/lowering (native tests only; the account WASM keeps the
# client-only default from the workspace pin). perch-ir gives the test the
# same canonicalize+hash the compiler uses, to verify a doc recovered from
# the `DocApplied` event against the stored hash.
perch-doc-compiler = { workspace = true, features = ["contract"] }
perch-interpreter = { workspace = true }
perch-ir = { workspace = true }
