[package]
name = "nido-wallet-checker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cedar-policy = { version = "=4.14.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
sha2 = "=0.10.9"
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
stellar-xdr = { version = "=28.0.1", default-features = false, features = ["std", "base64"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
