name = "nido-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# Production: today the testnet build on nido.fyi.
routes = [
  { pattern = "*.nido.fyi/*", zone_name = "nido.fyi" }
]

[vars]
# The Pages production origin for nido (Cloudflare appended "-1am" because the
# bare `nido` project subdomain was taken).
PAGES = "nido-1am.pages.dev"
CSP_SITE_HOSTS = "https://*.nido.fyi"
CSP_NETWORK_HOSTS = "https://nido.fly.dev https://soroban-testnet.stellar.org https://horizon-testnet.stellar.org https://friendbot.stellar.org"

# Testnet on test.nido.fyi (`wrangler deploy --env testnet`, deployed
# automatically by deploy-testnet.yml on every push to main), its own `test`
# branch Pages build — not the production origin above. Not reachable yet:
# until an advanced certificate covering *.test.nido.fyi is active those hosts
# have no TLS, and the production route above already answers for them. Add
# its routes, together with nido-resolver's testnet route, only once that
# certificate is active: a `*.test.nido.fyi/*` proxy route outranks the
# production resolver route for `*.test.nido.fyi/.well-known/nido.json`
# (hostname specificity beats path), so deploying one without the other
# breaks testnet name resolution. Until then nothing serves this environment
# (the Worker deploys fine either way; it just has no route).
[env.testnet]
name = "nido-proxy-testnet"
workers_dev = false
routes = []

[env.testnet.vars]
# The `test` branch Pages deployment (deploy-testnet.yml's
# `wrangler pages deploy ... --branch test`), NOT the production origin above
# — this is what actually makes test.nido.fyi serve a different build than
# nido.fyi, rather than the same one.
PAGES = "test.nido-1am.pages.dev"
CSP_SITE_HOSTS = "https://*.nido.fyi"
CSP_NETWORK_HOSTS = "https://nido.fly.dev https://soroban-testnet.stellar.org https://horizon-testnet.stellar.org https://friendbot.stellar.org"
