[package]
name = "nido-recovery-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# "alloc" mirrors nido-zk-verifier: the vendored verifier lib needs a global
# allocator on wasm32v1-none, which soroban-sdk only wires up with this
# feature enabled.
soroban-sdk = { workspace = true, features = ["alloc"] }
ultrahonk_soroban_verifier = { path = "../vendor/ultrahonk-soroban-verifier", default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["alloc", "testutils"] }
