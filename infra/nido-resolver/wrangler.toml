name = "nido-resolver"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# stellar-sdk pulls Node built-ins (Buffer, etc.); enable the Workers Node shim.
compatibility_flags = ["nodejs_compat"]

# Production: today testnet on nido.fyi. More specific than nido-proxy's
# "*.nido.fyi/*", so Cloudflare routes /.well-known/nido.json here and
# everything else stays on the proxy.
routes = [
  { pattern = "*.nido.fyi/.well-known/nido.json", zone_name = "nido.fyi" }
]

[vars]
NIDO_NETWORK = "testnet"
NIDO_RPC_URL = "https://soroban-testnet.stellar.org"
NIDO_REGISTRY_ID = "CDVVRZAVXTUQLS5LCGUP3H26RGOIUFKNE2UEJ6CAWYMBWY5LNORF6POX"
NIDO_NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
NIDO_APEXES = "test.nido.fyi,nido.fyi"

# Testnet on test.nido.fyi (`wrangler deploy --env testnet`, deployed
# automatically by deploy-testnet.yml on every push to main). The Advanced
# Certificate for *.test.nido.fyi is active, so both the
# bare apex and every account's own name/address lookup under test.nido.fyi
# have valid TLS. MUST deploy together with nido-proxy's matching
# `*.test.nido.fyi/*` route: without this wildcard here, nido-proxy's wins
# the route-specificity contest for *.test.nido.fyi/.well-known/nido.json
# (hostname specificity beats path), sending account lookups to the proxy
# instead of here and breaking name resolution for every test.nido.fyi
# account.
[env.testnet]
name = "nido-resolver-testnet"
workers_dev = false
routes = [
  { pattern = "test.nido.fyi/.well-known/nido.json", zone_name = "nido.fyi" },
  { pattern = "*.test.nido.fyi/.well-known/nido.json", zone_name = "nido.fyi" }
]

[env.testnet.vars]
NIDO_NETWORK = "testnet"
NIDO_RPC_URL = "https://soroban-testnet.stellar.org"
NIDO_REGISTRY_ID = "CDVVRZAVXTUQLS5LCGUP3H26RGOIUFKNE2UEJ6CAWYMBWY5LNORF6POX"
NIDO_NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
NIDO_APEXES = "test.nido.fyi"
