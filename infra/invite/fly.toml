# Invitation code service for in-person demo events (see diagram in
# demo-plan.md): Builder issues codes, Checker validates+claims one against a
# predicted C-address, Poller confirms on chain that the address was actually
# created.
#
# Store is Fly Postgres (src/postgresStore.ts), not the in-memory one local
# dev uses — DATABASE_URL isn't set here because `fly postgres attach` injects
# it as a secret when the Postgres app is attached (see README "Deploy").
# API_KEY is a secret too (`fly secrets set API_KEY=...`), same as the
# relayer's own — never put it in this [env] block.
app = "nido-invite"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RPC_URL = "https://soroban-testnet.stellar.org"
  CODE_TTL_MS = "604800000"
  POLL_INTERVAL_MS = "5000"

[http_service]
  internal_port = 8080
  force_https = true
  # Only runs during demo events — let it scale to zero between them instead
  # of the relayer's always-on config.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
