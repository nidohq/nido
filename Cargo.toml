[workspace]
resolver = "2"
members = [
    "crates/integration-tests",
    "contracts/*",
]
# examples/* are self-contained stellar-scaffold projects with their own
# workspace + toolchain; keep them out of this workspace's resolution.
# vendor/perch is the Perch submodule: its crates belong to Perch's own
# workspace (Nido consumes them as git dependencies, below).
exclude = ["examples", "vendor/perch"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
soroban-sdk = "28.0.0"
# admin-sep: SEP admin/upgrade contract traits (`Administratable` + `Upgradable`,
# soroban-sdk-27 `#[contracttrait]` default methods). Used by the policy,
# verifier, name-registry and factory contracts. Published by theahaco
# (https://github.com/theahaco/admin-sep); Apache-2.0.
admin-sep = "0.27.0"
# Perch's pinned OZ fork, the same rev vendor/perch/Cargo.toml pins:
# theahaco/stellar-contracts-OZ PR #5 (head 3372676), stacked on PR #4 and the
# CAP-0071 delegated-auth patch (PR #3, on upstream fbfde38). PR #4 adds the
# `*_no_events` mutations (apply_doc emits one DocApplied instead) and PR #5
# `reconcile_signers`. Nido's contracts and Perch's account, controller and
# compiler must share ONE `stellar-accounts` crate: the factory hands the
# account `Signer`s, and the tests build `AuthPayload`s for it. Upstream
# adoption is tracked by Perch (docs/recovery/cap-0071.md there).
stellar-accounts = { version = "0.7.1", git = "https://github.com/theahaco/stellar-contracts-OZ.git", rev = "33726766a1fd5e7e3d2977d79f64ee29e1ea3ca9", package = "stellar-accounts" }
# soroban-sdk-tools 0.1.3 (crates.io) targets soroban-sdk 27.
soroban-sdk-tools = "0.1.3"

# The Perch stack (stellar-registry/perch epic #99), as git dependencies on
# Perch's main. Perch publishes no crates yet; versions replace the rev once it
# does. The rev is the vendor/perch submodule's commit, which carries the
# testnet deployment manifest (deployments/testnet.json) the stack is fetched
# by: scripts/repin-perch.sh moves both together, and
# scripts/check-perch-drift.sh fails when they differ. The build reads only
# tracked files (the smart account's build-time pins are committed in Perch),
# so cargo needs no submodule. All Perch crates come from the one rev so their
# types unify.
perch-account = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-smart-account = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-recovery = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-recovery-interface = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-doc-compiler = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-interpreter = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-spending-limit = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-zk-pool = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-zk-adapter = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-zk-prover = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-zk-primitives = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-ir = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }
perch-registry-resolve = { git = "https://github.com/stellar-registry/perch", rev = "2258433aa340428d65676cd269c8e4240674deb1" }

[profile.release]
overflow-checks = true

[profile.contract]
overflow-checks = true
inherits = "release"
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
