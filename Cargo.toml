[workspace]
resolver = "2"
members = [
    "crates/integration-tests",
    "contracts/*",
]
# examples/* are self-contained stellar-scaffold projects with their own
# workspace + toolchain; keep them out of this workspace's resolution.
# vendor/perch is the Perch submodule: its crates belong to Perch's own
# workspace and are consumed below as path dependencies.
exclude = ["examples", "vendor/perch"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
soroban-sdk = "27.0.2"
# admin-sep: SEP admin/upgrade contract traits (`Administratable` + `Upgradable`,
# soroban-sdk-27 `#[contracttrait]` default methods). Used by the policy,
# verifier, name-registry and factory contracts. Published by theahaco
# (https://github.com/theahaco/admin-sep); Apache-2.0.
admin-sep = "0.27.0"
# Perch's pinned OZ fork, the same rev vendor/perch/Cargo.toml pins:
# theahaco/stellar-contracts-OZ PR #5 (head 3372676), stacked on PR #4 and the
# CAP-0071 delegated-auth patch (PR #3, on upstream fbfde38). PR #4 adds the
# `*_no_events` mutations (apply_doc emits one DocApplied instead) and PR #5
# `reconcile_signers`. Nido's contracts and Perch's account, controller and
# compiler must share ONE `stellar-accounts` crate: the factory hands the
# account `Signer`s, and the tests build `AuthPayload`s for it. Upstream
# adoption is tracked by Perch (docs/recovery/cap-0071.md there).
stellar-accounts = { version = "0.7.1", git = "https://github.com/theahaco/stellar-contracts-OZ.git", rev = "33726766a1fd5e7e3d2977d79f64ee29e1ea3ca9", package = "stellar-accounts" }
# soroban-sdk-tools 0.1.3 (crates.io) targets soroban-sdk 27.
soroban-sdk-tools = "0.1.3"

# The Perch stack (stellar-registry/perch epic #99), consumed from the
# vendor/perch submodule, which pins the deployment record at the top of the
# #99 stack (fm/perch-epic99-deploy-p8 at 836fdc9, stellar-registry/perch#112)
# and its testnet deployment manifest (deployments/testnet.json). These move to
# published packages once Perch merges and publishes that release.
#
# Path dependencies rather than git dependencies because
# `perch-smart-account` reads a fetched, git-ignored pin cache at build time
# (`crates/perch-smart-account/wasm/`); `just perch-infra` fills it from the
# manifest. All Perch crates come from the one checkout so their types unify.
perch-account = { path = "vendor/perch/crates/perch-account" }
perch-smart-account = { path = "vendor/perch/crates/perch-smart-account" }
perch-recovery = { path = "vendor/perch/crates/perch-recovery" }
perch-recovery-interface = { path = "vendor/perch/crates/perch-recovery-interface" }
perch-doc-compiler = { path = "vendor/perch/crates/perch-doc-compiler" }
perch-interpreter = { path = "vendor/perch/crates/perch-interpreter" }
perch-spending-limit = { path = "vendor/perch/crates/perch-spending-limit" }
perch-zk-pool = { path = "vendor/perch/crates/perch-zk-pool" }
perch-zk-adapter = { path = "vendor/perch/crates/perch-zk-adapter" }
perch-zk-prover = { path = "vendor/perch/crates/perch-zk-prover" }
perch-zk-primitives = { path = "vendor/perch/crates/perch-zk-primitives" }
perch-ir = { path = "vendor/perch/crates/perch-ir" }

[profile.release]
overflow-checks = true

[profile.contract]
overflow-checks = true
inherits = "release"
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
